name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bee:
    name: BeeChat web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bee
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bee/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  electron:
    name: Electron shell (syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./desktop/electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check shell scripts
        run: npm run check --if-present
